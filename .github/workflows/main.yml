name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Check and Prepare 500GB Workspace
        shell: powershell
        run: |
          Write-Host "=== DISK SPACE ==="
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free

          $drive = Get-PSDrive -Name C

          $freeGB = [math]::Round($drive.Free / 1GB, 2)

          Write-Host "C: free space: $freeGB GB"

          if ($freeGB -lt 500) {
              Write-Warning "Less than 500GB free space is available."
              Write-Warning "GitHub-hosted runner storage cannot be increased to 500GB by the workflow."
          }

          # Create workspace
          New-Item -ItemType Directory -Force -Path "C:\ROM-BUILD" | Out-Null

          # Set environment variable for later build steps
          echo "ROM_WORKSPACE=C:\ROM-BUILD" >> $env:GITHUB_ENV

          Write-Host "ROM workspace: C:\ROM-BUILD"

      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }

          Write-Host "RDP connectivity successful!"

      - name: Show Workspace Storage
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "       ROM BUILD WORKSPACE"
          Write-Host "================================="

          Get-PSDrive C |
            Select-Object Name,
              @{N="FreeGB";E={[math]::Round($_.Free/1GB,2)}},
              @{N="UsedGB";E={[math]::Round($_.Used/1GB,2)}}

          Write-Host ""
          Write-Host "Workspace: $env:ROM_WORKSPACE"
          Write-Host "RDP IP:    $env:TAILSCALE_IP"
          Write-Host "Username:  RDP"
          Write-Host "Password:  $env:RDP_CREDS"
          Write-Host "================================="

      - name: Maintain Connection
        shell: powershell
        run: |
          while ($true) {
              $free = [math]::Round(
                  (Get-PSDrive C).Free / 1GB,
                  2
              )

              Write-Host "[$(Get-Date)] RDP Active | Free: $free GB"

              Start-Sleep -Seconds 300
          }
